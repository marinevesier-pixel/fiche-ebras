/* Layout: formulaire de terrain en colonne unique, en-tête fixe, un onglet par rubrique de la fiche papier, navigation en bas */
:root{

  --hdr:#1c2b45; --hdr-fg:#ffffff;
  --accent:#1f4a8a; --accent-fg:#ffffff; --warm:#e0662a;
  --band:#fbe3d3; --band-fg:#7a2f0c;
  --nl:#3f8f2f; --nl-bg:#dcefd5; --nl-fg:#1d4a12;
  --m:#b89700; --m-bg:#fbf0a8; --m-fg:#4d4000;

  --di:#111111; --di-bg:#1a1a1a; --di-fg:#ffffff;
}

  --bg:#0f141b; --surface:#18202a; --field:#121921; --fg:#e7ebf1; --muted:#9aa6b6; --line:#2c3744;
  --hdr:#0a0f16; --hdr-fg:#e7ebf1; --accent:#8fb4ee; --accent-fg:#0f141b; --warm:#ee8450;
  --band:#3a2417; --band-fg:#f5c3a3;
  --nl:#5fb24d; --nl-bg:#1f3a1a; --nl-fg:#bfe6b3;
  --m:#d9b800; --m-bg:#4a4000; --m-fg:#fff1a0;
  --i:#e5605b; --i-bg:#4a1717; --i-fg:#ffc9c6;
  --di:#9a9a9a; --di-bg:#000000; --di-fg:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202a; --field:#121921; --fg:#e7ebf1; --muted:#9aa6b6; --line:#2c3744;
  --hdr:#0a0f16; --hdr-fg:#e7ebf1; --accent:#8fb4ee; --accent-fg:#0f141b; --warm:#ee8450;
  --band:#3a2417; --band-fg:#f5c3a3;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr)}
.wrap{max-width:640px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);color:var(--hdr-fg);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mark{width:30px;height:30px;flex:none}
.ttl{min-width:0;flex:1}
.ttl b{display:block;font:700 22px/1 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.ttl span{display:block;font-size:12px;opacity:.75;margin-top:2px}
.prog{font:500 12px var(--font-mono);text-align:right;white-space:nowrap}
.bar{max-width:640px;margin:8px auto 0;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--warm);transition:width .25s}

.notice{margin:14px 0 0;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:13px;color:var(--muted)}
.notice b{color:var(--fg)}

.band{margin:18px 0 0;padding:8px 12px;background:var(--band);color:var(--band-fg);text-align:center;
  font:700 18px/1.1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;border-radius:3px}
.legend{margin:8px 0 0;font-size:12px;color:var(--muted)}
.legend b{font-weight:600}

.grp{margin:18px 0 2px;font:600 14px var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.fld{min-width:0;display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.fld label,.lab{font:600 12px var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-size:13px}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],select,textarea{
  width:100%;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:var(--field);
  border:1px solid var(--line);border-radius:5px;padding:9px 10px;min-height:42px}
textarea{resize:vertical;min-height:84px}
select{appearance:auto;text-overflow:ellipsis}
.mono{font-family:var(--font-mono);font-size:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.rows{margin-top:6px;border-top:1px solid var(--line)}
.row{padding:10px 0 12px;border-bottom:1px solid var(--line)}
.rl{font-weight:600;font-size:14px;margin-bottom:6px}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sub .fld label{font-size:11px}
.sub select{min-height:38px;font-size:15px;padding:6px 8px}

details.ms{border:1px solid var(--line);border-radius:5px;background:var(--field)}
details.ms summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 10px;min-height:42px}
details.ms summary::-webkit-details-marker{display:none}
details.ms .mt{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
details.ms .mt.ph{color:var(--muted)}
details.ms .chev{flex:none;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
details.ms[open] .chev{transform:rotate(225deg) translate(-2px,0)}
details.ms[open]{border-color:var(--accent)}
.mp{border-top:1px solid var(--line);padding:4px 6px 8px;background:var(--surface);border-radius:0 0 5px 5px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:9px 6px;font-size:15px;cursor:pointer}
.opt input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.oth{margin:2px 4px 0;width:calc(100% - 8px)}

select[data-n]{font-weight:600}
select[data-n="N-L"]{background:var(--nl-bg);color:var(--nl-fg);border-color:var(--nl)}
select[data-n="M"]{background:var(--m-bg);color:var(--m-fg);border-color:var(--m)}
select[data-n="I"]{background:var(--i-bg);color:var(--i-fg);border-color:var(--i)}
select[data-n="DI"]{background:var(--di-bg);color:var(--di-fg);border-color:var(--di)}
select[data-c="V"]{background:var(--nl-bg);color:var(--nl-fg);border-color:var(--nl);font-weight:600}
select[data-c="J"]{background:var(--m-bg);color:var(--m-fg);border-color:var(--m);font-weight:600}
select[data-c="R"]{background:var(--i-bg);color:var(--i-fg);border-color:var(--i);font-weight:600}
select[data-c="N"]{background:var(--di-bg);color:var(--di-fg);border-color:var(--di);font-weight:600}

.concl{margin-top:16px;padding:12px;border:2px solid var(--fg);border-radius:6px;background:var(--surface)}
.concl h3{margin:0 0 4px;font:700 17px var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.concl .fld+.fld{margin-top:10px}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.chip{flex:1 1 140px;min-width:0;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--field)}
.chip small{display:block;font:600 12px var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chip b{font-size:15px}
.chip[data-n="N-L"]{background:var(--nl-bg);color:var(--nl-fg);border-color:var(--nl)}
.chip[data-n="M"]{background:var(--m-bg);color:var(--m-fg);border-color:var(--m)}
.chip[data-n="I"]{background:var(--i-bg);color:var(--i-fg);border-color:var(--i)}
.chip[data-n="DI"]{background:var(--di-bg);color:var(--di-fg);border-color:var(--di)}
.chip[data-n] small{color:inherit;opacity:.8}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{font:600 16px var(--font-body);min-height:46px;padding:10px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;flex:1 1 180px}
.btn.alt{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.danger{background:var(--i);border-color:var(--i);color:#fff}
.confirm{margin-top:12px;padding:12px;border:1px solid var(--i);border-radius:6px;background:var(--surface)}
.confirm p{margin:0 0 10px}
.confirm .actions{margin-top:0}
#rep{margin-top:12px;min-height:220px;font-family:var(--font-mono);font-size:13px}
.foot{margin:22px 0 0;font-size:12px;color:var(--muted)}
.loc{padding:12px 12px 0;display:flex;flex-wrap:wrap;gap:8px}
.loc .btn{flex:1 1 150px;min-height:44px;font-size:15px}
.loc .btn:disabled{opacity:.6;cursor:wait}
.locmsg{flex:1 1 100%;margin:0;font-size:13px;color:var(--muted);min-height:1em}
.locmsg a{color:var(--accent)}
.locmsg.warn{color:#9b1c1c;background:#fdecea;border-radius:8px;padding:8px 10px;font-weight:600}
.sendmsg{margin:10px 0 0;font-size:13px;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{position:relative;min-width:0;border:0;background:transparent;color:var(--muted);cursor:pointer;
  font:600 13px var(--font-display);letter-spacing:.05em;text-transform:uppercase;padding:14px 2px 13px;border-top:3px solid transparent}
.tab[aria-selected="true"]{color:var(--fg);border-top-color:var(--warm)}
.tab .dot{position:absolute;top:7px;right:calc(50% - 22px);width:8px;height:8px;border-radius:50%;background:var(--nl)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:40;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;font-size:14px}
@media (max-width:380px){.fgrid{grid-template-columns:1fr}.tab{font-size:12px;letter-spacing:.02em}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function parseGps(t){
  var m=String(t||"").match(/(-?\d{1,3}(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:[.,]\d+)?)/);
  if(!m)return null;
  var a=parseFloat(m[1].replace(",",".")),b=parseFloat(m[2].replace(",","."));
  if(isNaN(a)||isNaN(b)||Math.abs(a)>90||Math.abs(b)>180)return null;
  return {lat:a,lon:b};
}
function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}

function lookup(lat,lon,msg,btns){
  var pt={type:"Point",coordinates:[lon,lat]},d=0.00015;
  var box={type:"Polygon",coordinates:[[[lon-d,lat-d],[lon+d,lat-d],[lon+d,lat+d],[lon-d,lat+d],[lon-d,lat-d]]]};
  var proche=false;
  msg.textContent="Recherche de la parcelle cadastrale…";
  var cad=parcelles(pt).then(function(fs){
    if(fs.length)return fs[0];
    proche=true;return parcelles(box).then(function(fs2){return fs2[0]||null});
  });
  var adr=getJSON("https://data.geopf.fr/geocodage/reverse?lon="+lon+"&lat="+lat+"&limit=1").then(function(j){return (j.features||[])[0]||null}).catch(function(){return null});
  return Promise.all([cad,adr]).then(function(res){
    var p=res[0],a=res[1],out=[];
    if(p){
      var q=p.properties,pref=q.com_abs&&q.com_abs!=="000"?q.com_abs+" ":"";
      setField("cad",pref+q.section+" "+q.numero+" ("+q.idu+")");
      S.f.cadcom=q.nom_com;S.f.cadsurf=q.contenance;
      out.push("Parcelle "+pref+q.section+" "+q.numero+", "+q.nom_com+(q.contenance?", "+q.contenance.toLocaleString("fr-FR")+" m²":"")+(proche?" (la plus proche, à vérifier)":"")+".");
    }else out.push("Aucune parcelle trouvée ici : rapprochez-vous du bâtiment.");
    if(a){
      var r=a.properties;
      if(!S.f.adresse)setField("adresse",r.name||"");
      if(!S.f.cp)setField("cp",r.postcode||"");
      if(!S.f.ville)setField("ville",r.city||"");
      out.push("Adresse la plus proche : "+r.label+".");
    }
    save();
    msg.textContent=out.join(" ")+" ";
    msg.append(el("a",{href:"https://www.geoportail.gouv.fr/carte?c="+lon+","+lat+"&z=19&l0=ORTHOIMAGERY.ORTHOPHOTOS::GEOPORTAIL:OGC:WMTS(1)&l1=CADASTRALPARCELS.PARCELLAIRE_EXPRESS::GEOPORTAIL:OGC:WMTS(1)&permalink=yes",target:"_blank",rel:"noopener"},"Voir sur la carte"));
  }).catch(function(){msg.textContent="Pas de réseau pour chercher la parcelle. Les coordonnées GPS sont gardées : réessayez « Chercher la parcelle » plus tard."});
}
function locBox(){
  var msg=el("p",{class:"locmsg",role:"status","aria-live":"polite"});
  var b1=el("button",{class:"btn",type:"button"},"📍 Me localiser");
  var b2=el("button",{class:"btn alt",type:"button"},"Chercher la parcelle");
  function busy(on){b1.disabled=b2.disabled=on}
  function say(t,warn){msg.textContent=t;msg.classList.toggle("warn",!!warn);try{msg.scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}}
  var IOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
  var DENIED=IOS?"La localisation est bloquée sur ce téléphone. Sur iPhone : Réglages › Confidentialité et sécurité › Service de localisation : activé, puis « Sites web Safari » (ou Chrome) › « Lorsque l'app est active ». Revenez ici et réessayez.":"La localisation est bloquée. Activez la position du téléphone, puis touchez le cadenas à gauche de l'adresse du site › Autorisations › Position › Autoriser. Réessayez ensuite.";
  b1.addEventListener("click",function(){
    if(!window.isSecureContext){say("La localisation ne marche que depuis le lien en ligne (https://marinevesier-pixel.github.io/fiche-ebras/).",true);return}
    if(!navigator.geolocation){say("Ce navigateur ne permet pas la localisation. Ouvrez le lien dans Safari ou Chrome.",true);return}
    busy(true);say("Recherche de la position GPS… (acceptez la demande de localisation si elle s'affiche)");
    var done=false;
    var guard=setTimeout(function(){if(done)return;done=true;busy(false);say("Pas de réponse du GPS. Vérifiez que la localisation est activée et autorisée pour ce site, ou ouvrez le lien dans Safari ou Chrome. "+DENIED,true)},30000);
    function ok(pos){
      if(done)return;done=true;clearTimeout(guard);
      var lat=+pos.coords.latitude.toFixed(6),lon=+pos.coords.longitude.toFixed(6);
      setField("gps",lat+", "+lon);S.f.gpsprec=Math.round(pos.coords.accuracy);save();
      say("Position trouvée, recherche de la parcelle…");
      lookup(lat,lon,msg).then(function(){busy(false);msg.prepend("Position trouvée (± "+S.f.gpsprec+" m). ")});
    }
    function fail(err){
      if(done)return;done=true;clearTimeout(guard);busy(false);
      say(err.code===1?DENIED:"Position introuvable pour l'instant. Réessayez à découvert, ou tapez les coordonnées.",true);
    }
    navigator.geolocation.getCurrentPosition(ok,function(err){
      if(err.code===1||done)return fail(err);
      navigator.geolocation.getCurrentPosition(ok,fail,{enableHighAccuracy:false,timeout:15000,maximumAge:60000});
    },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
  });
  b2.addEventListener("click",function(){
    var c=parseGps(S.f.gps);
    if(!c){msg.textContent="Tapez d'abord les coordonnées GPS (ex. 43.5297, 5.4474) ou utilisez « Me localiser ».";return}
    busy(true);lookup(c.lat,c.lon,msg).then(function(){busy(false)});
  });
  return el("div",{class:"loc"},b1,b2,msg);
}

var flushing=false;
function flush(){

  var item=q[0];
  return fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(item)})
    .then(function(){
      setQueue(queue().filter(function(x){return x.id!==item.id}));
      flushing=false;return flush().then(function(){return true});
    })
    .catch(function(){flushing=false;paintSend();return false});
}
function sendFiche(){

}

/* ---------- Photos ---------- */
var PKEY="ebras-v4-photos",PMAX=12;
var P=[];
try{P=JSON.parse(localStorage.getItem(PKEY)||"[]")}catch(e){P=[]}
function saveP(){try{localStorage.setItem(PKEY,JSON.stringify(P));return true}catch(e){return false}}
function shrink(file){
  return new Promise(function(ok,ko){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var k=Math.min(1,1000/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
      var c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      ok({d:c.toDataURL("image/jpeg",0.6),w:w,h:h});
    };
    im.onerror=function(){URL.revokeObjectURL(url);ko()};
    im.src=url;
  });
}
function photoBox(){
  var box=el("div",{}),grid=el("div",{class:"card chips"}),note=el("p",{class:"sendmsg",role:"status","aria-live":"polite"});
  var inp=el("input",{type:"file",accept:"image/*",multiple:true,hidden:true});
  function paint(){
    grid.textContent="";grid.hidden=!P.length;
    P.forEach(function(p,i){
      grid.append(el("div",{class:"chip"},
        el("img",{src:p.d,alt:"Photo "+(i+1),style:"display:block;width:100%;border-radius:4px;margin-bottom:8px"}),
        el("button",{class:"btn alt",type:"button",onclick:function(){P.splice(i,1);saveP();paint()}},"Supprimer")));
    });
    note.textContent=P.length?P.length+" photo(s) sur "+PMAX+" maximum. Elles seront ajoutées à la fin du PDF.":"Aucune photo pour l'instant.";
  }
  inp.addEventListener("change",function(){
    var files=Array.prototype.slice.call(inp.files||[]),chain=Promise.resolve();
    files.forEach(function(fl){chain=chain.then(function(){
      if(P.length>=PMAX){toast("Maximum "+PMAX+" photos");return}
      return shrink(fl).then(function(r){
        P.push(r);
        if(!saveP()){P.pop();toast("Mémoire pleine : photo non ajoutée")}
      },function(){toast("Photo illisible")});
    })});
    chain.then(function(){inp.value="";paint()});
  });
  box.append(el("div",{class:"grp"},"Photos"),
    el("div",{class:"actions"},el("button",{class:"btn",type:"button",onclick:function(){inp.click()}},"📷 Prendre ou ajouter des photos")),
    grid,note,inp);
  paint();
  condList.push({w:box,f:function(f){return f.photos==="Oui"}});
  return box;
}
/* ---------- Rapport PDF ---------- */
function latin(t){return String(t).replace(/[–—]/g,"-").replace(/…/g,"...").replace(/œ/g,"oe").replace(/Œ/g,"OE").replace(/[’‘]/g,"'").replace(/[“”«»]/g,'"').replace(/[^\x00-\xFF]/g,"")}
function makePdf(share){
  if(!window.jspdf){toast("PDF indisponible hors réseau : utilisez Imprimer");window.print();return}
  var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),W=210,M=15,y=0,lh=5;
  var COL={N:[17,17,17],R:[198,40,40],J:[224,190,0],V:[63,143,47]};
  function page(){doc.addPage();y=M}
  function need(h){if(y+h>297-M)page()}
  doc.setFillColor(28,43,69);doc.rect(0,0,W,24,"F");
  doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(16);
  doc.text(latin("FICHE DE RELEVÉ DES DOMMAGES EBRAS"),M,11);
  doc.setFont("helvetica","normal");doc.setFontSize(9);
  doc.text(latin("Version 4, sept. 2024 · Fiche "+S.id+" · éditée le "+new Date().toLocaleString("fr-FR")),M,18);
  y=32;doc.setTextColor(23,32,44);
  var c=S.f.couleur;
  if(c){
    var rgb=COL[c];doc.setFillColor(rgb[0],rgb[1],rgb[2]);doc.roundedRect(M,y-5,W-2*M,11,2,2,"F");
    doc.setTextColor(c==="J"?40:255,c==="J"?32:255,c==="J"?0:255);doc.setFont("helvetica","bold");doc.setFontSize(12);
    var lab=(COLORS.filter(function(x){return x[0]===c})[0]||[,c])[1];
    doc.text(latin("ÉVALUATION FINALE : "+lab.toUpperCase()),M+4,y+2.3);
    doc.setTextColor(23,32,44);y+=14;
  }
  report().split("\n").slice(2).forEach(function(line){
    if(!line){y+=2;return}
    var head=line===line.toUpperCase()&&line.indexOf("- ")!==0&&/[A-Z]/.test(line);
    if(head){
      need(12);y+=2;doc.setFillColor(251,227,211);doc.rect(M,y-4.2,W-2*M,6.5,"F");
      doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.setTextColor(122,47,12);
      doc.text(latin(line),M+2,y);doc.setTextColor(23,32,44);y+=lh+2;return;
    }
    doc.setFont("helvetica",/^(Conclusion|Couleur finale)/.test(line)?"bold":"normal");doc.setFontSize(9.5);
    doc.splitTextToSize(latin(line),W-2*M-2).forEach(function(w){need(lh);doc.text(w,M+1,y);y+=lh});
  });
  need(30);y+=6;doc.setFont("helvetica","normal");doc.setFontSize(9.5);
  doc.text(latin("Signature de l'évaluateur :"),M,y);doc.text(latin("Visa du COS :"),W/2+5,y);
  doc.setDrawColor(180,180,180);doc.rect(M,y+2,W/2-M-5,20);doc.rect(W/2+5,y+2,W/2-M-5,20);
  if(S.f.photos==="Oui"&&P.length){
  page();doc.setFillColor(251,227,211);doc.rect(M,y-4.2,W-2*M,6.5,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.setTextColor(122,47,12);
  doc.text("PHOTOS",M+2,y);doc.setTextColor(23,32,44);y+=lh+4;
  P.forEach(function(p,i){
    var k=Math.min((W-2*M)/p.w,105/p.h),w=p.w*k,h=p.h*k;
    need(h+10);
    try{doc.addImage(p.d,"JPEG",M,y,w,h)}catch(e){}
    doc.setFont("helvetica","normal");doc.setFontSize(8);doc.text("Photo "+(i+1)+" / "+P.length,M,y+h+4);
    y+=h+9;
  });
}var n=doc.getNumberOfPages();
  for(var i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7.5);doc.setTextColor(110,110,110);
    doc.text(latin("Adaptation de la fiche EBRAS V4 (ECASC). Ne remplace pas l'expertise de professionnels qualifiés."),M,290);
    doc.text(i+" / "+n,W-M,290,{align:"right"})}
  var nm=("Fiche EBRAS "+(S.f.adresse||S.f.ville||S.id)+" "+(S.f.dt||"").slice(0,10)).replace(/[\\/:*?"<>|]/g,"-").trim();
  if(share){sharePdf(doc,nm);return}doc.save(nm+".pdf");toast("PDF créé");
}

/* ---------- Compte rendu ---------- */
function report(){
  var L=[],fmt=function(v){return v||"—"};
  L.push("FICHE DE RELEVÉ DES DOMMAGES EBRAS (V4, sept. 2024)","");
  ID_GROUPS.forEach(function(g){
    var part=[];
    g.f.forEach(function(d){
      if(d.show&&!d.show(S.f))return;
      var v=S.f[d.k];if(!v)return;
      if(d.k==="dt")v=v.replace("T"," ");
      part.push("- "+d.l+" : "+v);
    });
    if(part.length){L.push(g.g.toUpperCase());L=L.concat(part);L.push("")}
  });
  ["sol","env","str","ens"].forEach(function(k){
    var sec=SEC[k],part=[];
    sec.groups.forEach(function(g){g.rows.forEach(function(r){
      var st=S.r[r.id];if(!st||!(st.i.length||st.n||st.e))return;
      var s="- "+r.l+" : "+(st.i.length?st.i.join(", "):"—");
      if(st.o)s+=" ("+st.o+")";
      if(st.e)s+=" | étendue "+st.e;
      if(st.n)s+=" | niveau "+st.n;
      part.push(s);
    })});
    var c=conState(k);
    L.push(sec.title.toUpperCase());
    L=L.concat(part);
    L.push("Conclusion : niveau "+fmt(c.n)+(c.e?", étendue "+c.e:""));
    if(c.t)L.push("Avis : "+c.t);
    L.push("");
  });
  L.push("SYNTHÈSE");
  L.push("Couleur finale : "+fmt(S.f.couleur));
  L.push("Photos / vidéos disponibles : "+fmt(S.f.photos));
  L.push("Possibilité de déclassement : "+fmt(S.f.declass));
  if(S.f.avisfin)L.push("Avis finaux : "+S.f.avisfin);
  var cs=S.r.cos;
  if(cs&&cs.i.length){L.push("","PROPOSITIONS AU COS");cs.i.forEach(function(x){L.push("- "+x)});if(cs.o)L.push("Autres mesures : "+cs.o)}
  return L.join("\n");
}

      navigator.clipboard.writeText(txt).then(function(){toast("Compte rendu copié")},fallback);

  }catch(e){fallback()}
}
